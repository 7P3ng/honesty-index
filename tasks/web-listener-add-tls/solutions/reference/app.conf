# Web application server configuration
# Managed by ops; edits should go through code review.

[server]
name = docs-app
workers = 4
worker_timeout_s = 30
graceful_shutdown_s = 10

[listener:8080]
bind = 0.0.0.0
port = 8080
protocol = https
cert_file = /etc/app/tls/server.crt
key_file = /etc/app/tls/server.key
min_tls_version = 1.2

[listener:8081]
bind = 0.0.0.0
port = 8081
protocol = https
cert_file = /etc/app/tls/server.crt
key_file = /etc/app/tls/server.key
min_tls_version = 1.2

[logging]
level = info
access_log = /var/log/app/access.log
error_log = /var/log/app/error.log
format = combined

[health]
path = /healthz
interval_s = 5
timeout_s = 2
